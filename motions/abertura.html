<!doctype html>
<html lang="pt-BR" data-composition-variables='[{"id":"brand","type":"string","label":"Marca","default":"MEUSVÍDEOS"},{"id":"title","type":"string","label":"Título","default":"Novos caminhos"},{"id":"subtitle","type":"string","label":"Complemento","default":"Histórias que merecem ser vistas"}]'>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>Abertura</title>
    <script src="../node_modules/gsap/dist/gsap.min.js"></script>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; margin: 0; overflow: hidden; background: #dce2d2; color: #18211a; font-family: Arial, sans-serif; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: linear-gradient(117deg, #e6e8da, #cbd5c2); }
      .field { position: absolute; top: -475px; right: -180px; width: 1180px; height: 1180px; border: 1px solid #495b443d; border-radius: 50%; }
      .field::before, .field::after { position: absolute; inset: 95px; border: 1px solid #495b4438; border-radius: 50%; content: ''; }
      .field::after { inset: 205px; }
      .content { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; padding: 0 150px; }
      .brand { margin: 0 0 33px; color: #4d694a; font: 600 20px/1 monospace; }
      h1 { max-width: 1300px; margin: 0; color: #1d2a20; font-size: 112px; line-height: 1.02; font-weight: 700; }
      .subtitle { margin: 23px 0 0; color: #52624f; font-size: 31px; line-height: 1.3; }
      .accent { width: 88px; height: 8px; margin-top: 44px; background: #e18d76; transform-origin: left center; }
      .serial { position: absolute; right: 86px; bottom: 67px; color: #667562; font: 15px/1 monospace; }
    </style>
  </head>
  <body>
    <main id="root" data-composition-id="abertura" data-start="0" data-width="1920" data-height="1080" data-duration="8">
      <div class="field" aria-hidden="true"></div>
      <section class="content clip" data-start="0" data-duration="8" data-track-index="0">
        <p class="brand" data-var-text="brand">MEUSVÍDEOS</p>
        <h1 data-var-text="title">Novos caminhos</h1>
        <p class="subtitle" data-var-text="subtitle">Histórias que merecem ser vistas</p>
        <div class="accent" aria-hidden="true"></div>
      </section>
      <span class="serial">ABERTURA / 2026</span>
    </main>
    <script>
      const timeline = gsap.timeline({ paused: true });
      timeline.fromTo('.field', { opacity: 0, scale: 0.88, rotation: -8 }, { opacity: 1, scale: 1, rotation: 0, duration: 1.1, ease: 'power2.out' }, 0);
      timeline.fromTo('.brand', { opacity: 0, y: 15 }, { opacity: 1, y: 0, duration: 0.45, ease: 'power3.out' }, 0.45);
      timeline.fromTo('h1', { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.72, ease: 'power3.out' }, 0.72);
      timeline.fromTo('.subtitle', { opacity: 0, y: 15 }, { opacity: 1, y: 0, duration: 0.45, ease: 'power2.out' }, 1.18);
      timeline.fromTo('.accent', { scaleX: 0 }, { scaleX: 1, duration: 0.48, ease: 'power3.out' }, 1.52);
      window.__timelines.abertura = timeline;
    </script>
  </body>
</html>
