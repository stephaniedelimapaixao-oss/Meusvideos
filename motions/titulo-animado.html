<!doctype html>
<html lang="pt-BR" data-composition-variables='[{"id":"eyebrow","type":"string","label":"Chamada","default":"UMA IDEIA EM MOVIMENTO"},{"id":"title","type":"string","label":"Título","default":"Sua mensagem"}]'>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>Título animado</title>
    <script src="../node_modules/gsap/dist/gsap.min.js"></script>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; margin: 0; overflow: hidden; background: #171b18; color: #f0f1e9; font-family: Arial, sans-serif; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: radial-gradient(ellipse at 76% 52%, #29352a 0, #1e2721 34%, #171b18 72%); }
      .grid { position: absolute; inset: 0; opacity: .14; background-image: linear-gradient(#9cac8d 1px, transparent 1px), linear-gradient(90deg, #9cac8d 1px, transparent 1px); background-size: 90px 90px; mask-image: linear-gradient(90deg, transparent, black); }
      .content { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; padding: 0 180px; }
      .eyebrow { margin: 0 0 27px; color: #c4e879; font: 500 23px/1.2 Arial, sans-serif; }
      h1 { max-width: 1450px; margin: 0; color: #f1f2e9; font-size: 118px; line-height: 1.03; font-weight: 700; overflow-wrap: anywhere; }
      .bar { width: 132px; height: 7px; margin-top: 39px; border-radius: 8px; background: #e18d76; transform-origin: left center; }
      .index { position: absolute; right: 80px; bottom: 70px; color: #758074; font: 16px/1 monospace; }
    </style>
  </head>
  <body>
    <main id="root" data-composition-id="titulo" data-start="0" data-width="1920" data-height="1080" data-duration="5">
      <div class="grid" aria-hidden="true"></div>
      <section class="content clip" data-start="0" data-duration="5" data-track-index="0">
        <p class="eyebrow" data-var-text="eyebrow">UMA IDEIA EM MOVIMENTO</p>
        <h1 data-var-text="title">Sua mensagem</h1>
        <div class="bar" aria-hidden="true"></div>
      </section>
      <span class="index">01 / 04</span>
    </main>
    <script>
      const timeline = gsap.timeline({ paused: true });
      timeline.fromTo('.eyebrow', { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0.25);
      timeline.fromTo('h1', { opacity: 0, y: 54 }, { opacity: 1, y: 0, duration: 0.85, ease: 'power4.out' }, 0.55);
      timeline.fromTo('.bar', { scaleX: 0 }, { scaleX: 1, duration: 0.55, ease: 'power3.out' }, 1.15);
      window.__timelines.titulo = timeline;
    </script>
  </body>
</html>
